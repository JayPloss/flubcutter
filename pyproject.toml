[project]
name = "flubcutter"
version = "0.1.0"
description = "Clean up home-recorded read-aloud audiobooks using the book text as ground truth"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "faster-whisper>=1.1",
    "numpy>=2.5.4",
]

[project.scripts]
flubcutter = "flubcutter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
