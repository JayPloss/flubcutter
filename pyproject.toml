[project]
name = "flubcutter"
version = "0.2.0"
description = "Clean up home-recorded read-aloud audiobooks using the book text as ground truth"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dpdfnet>=0.6.0",
    "fastapi>=0.143.3",
    "numpy>=2.5.4",
    "onnx-asr[cpu,hub]>=0.12.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
flubcutter = "flubcutter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
