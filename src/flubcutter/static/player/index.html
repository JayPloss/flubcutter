<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Story Shelf</title>
<link rel="icon" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="hero"><span class="brand">Story Shelf</span><span class="hero-sub">Read aloud at home</span></header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Books"></nav>
  <main class="main" id="main"></main>
</div>

<footer class="player" id="player" hidden>
  <div class="np">
    <div id="npCover" class="cover small"></div>
    <div class="np-text">
      <div id="npTitle" class="np-title"></div>
      <div id="npBook" class="np-book"></div>
    </div>
  </div>
  <div class="transport">
    <div class="buttons">
      <button id="back" class="icon" title="Back 15 seconds (←)" aria-label="Back 15 seconds">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.2" text-anchor="middle">15</text></svg>
      </button>
      <button id="play" class="play" title="Play / pause (Space)" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button id="fwd" class="icon" title="Forward 30 seconds (→)" aria-label="Forward 30 seconds">
        <svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.2" text-anchor="middle">30</text></svg>
      </button>
    </div>
    <div class="scrub">
      <span id="cur" class="time">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
      <span id="left" class="time">-0:00</span>
    </div>
  </div>
  <div class="extras">
    <button id="sleep" class="pill" title="Sleep timer">Sleep</button>
    <button id="speed" class="pill" title="Playback speed ([ and ])">1×</button>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
  </div>
</footer>

<audio id="audio" preload="metadata"></audio>
<script src="/static/app.js"></script>
</body>
</html>
